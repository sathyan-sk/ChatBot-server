[project]
name = "ai-knowledge-platform-backend"
version = "0.1.0"
description = "AI Knowledge Platform backend: application-isolated RAG chatbot service."
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",

    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.3,<1.0",

    "httpx>=0.27,<1.0",
    "bcrypt>=4.1,<5.0",
    "python-multipart>=0.0.9",
    "orjson>=3.10,<4.0",
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
    "aiosqlite>=0.20,<1.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "core",
    "domain",
    "infrastructure",
    "services",
    "schemas",
    "rag_engine",
    "worker",
    "exceptions",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["tests/", "migrations/"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "app",
    "core",
    "domain",
    "infrastructure",
    "services",
    "schemas",
    "rag_engine",
    "worker",
    "exceptions",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]